name: PHP CS Fixer

on:
  pull_request:
    paths:
      - 'src/**/*.php'
      - 'src/**/*.phtml'
      - 'src/.php-cs-fixer.dist.php'
      - '.github/workflows/php-cs-fixer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-cs-fixer:
    name: PHP CS Fixer
    runs-on: self-hosted

    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: php-cs-fixer

      - name: Check coding style
        run: php-cs-fixer fix --config=.php-cs-fixer.dist.php --dry-run --diff --verbose
