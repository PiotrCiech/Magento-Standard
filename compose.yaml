name: template-magento

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    container_name: php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    environment:
      COMPOSER_MEMORY_LIMIT: -1
      VALKEY_PASSWORD: "${VALKEY_PASSWORD:?Ustaw VALKEY_PASSWORD w pliku .env (skopiuj z .env.example)}"
      RABBITMQ_USER: "${RABBITMQ_USER:?Ustaw RABBITMQ_USER w pliku .env (skopiuj z .env.example)}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:?Ustaw RABBITMQ_PASSWORD w pliku .env}"
    depends_on:
      - db
      - opensearch
      - rabbitmq
      - valkey

  nginx:
    image: nginx:1.28-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./src:/var/www/html:ro
    configs:
      - source: nginx_magento
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      - php

  db:
    image: mariadb:11.8
    container_name: db
    restart: unless-stopped
    ports:
      - "${MARIADB_PORT:-3307}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-magento}
      MARIADB_USER: ${MARIADB_USER:-magento}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-magento}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_allowed_packet=512M
    volumes:
      - db_data:/var/lib/mysql

  opensearch:
    image: opensearchproject/opensearch:3.6.0
    container_name: opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      DISABLE_SECURITY_PLUGIN: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  valkey:
    image: valkey/valkey:8
    container_name: valkey
    restart: unless-stopped
    command:
      - valkey-server
      - --requirepass
      - "${VALKEY_PASSWORD:?Ustaw VALKEY_PASSWORD w pliku .env (skopiuj z .env.example)}"
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data

  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:?Ustaw RABBITMQ_USER w pliku .env (skopiuj z .env.example)}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?Ustaw RABBITMQ_PASSWORD w pliku .env}"
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

configs:
  nginx_magento:
    file: ./docker/nginx/default.conf

volumes:
  db_data:
  opensearch_data:
  valkey_data:
  rabbitmq_data:
